[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[project]
name = "refs"
version = "0.7.0"
description = "A personal source catalog with explicit bibliography export"
requires-python = ">=3.14,<3.15"
dependencies = ["typer>=0.27.2,<0.28", "pydantic>=2.13,<3", "bibtexparser==2.0.1", "pylatexenc==2.11"]

[project.scripts]
refs = "refs.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "pytest-xdist>=3,<4",
    "ruff",
    "ty==0.0.82",
]

[tool.uv]
exclude-newer = "3 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
markers = ["slow: installed smoke, lock waits, and external rendering consumers"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["specs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
